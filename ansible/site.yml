- name: Preparar todos los nodos
  hosts: all
  become: true
  roles:
    - common
    - docker
    - exportadores

- name: Desplegar NameNode, Spark Master y monitorización en el master
  hosts: masters
  become: true
  vars:
    servicios:
      - namenode
      - spark-master
  roles:
    - hdfs_spark
    - monitorizacion

- name: Desplegar DataNode y Spark Worker en los workers
  hosts: workers
  become: true
  vars:
    servicios:
      - datanode
      - spark-worker
  roles:
    - hdfs_spark