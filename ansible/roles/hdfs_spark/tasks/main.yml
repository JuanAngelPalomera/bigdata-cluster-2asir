---
- name: Crear directorio de trabajo en la máquina virtual
  ansible.builtin.file:
    path: /opt/bigdata
    state: directory
    mode: '0755'

- name: Copiar el docker-compose
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/bigdata/docker-compose.yml
    mode: '0644'

- name: Levantar solo los servicios que corresponden a este nodo
  community.docker.docker_compose_v2:
    project_src: /opt/bigdata
    services: "{{ servicios }}"
    state: present