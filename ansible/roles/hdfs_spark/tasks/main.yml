---
- name: Crear directorio de trabajo en la máquina virtual
  ansible.builtin.file:
    path: /opt/bigdata
    state: directory
    mode: '0755'

- name: Copiar el docker-compose al nodo master
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/bigdata/docker-compose.yml

- name: Asegurar que python3-pip y dependencias de docker estén instalados
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-docker
    state: present
    update_cache: true

- name: Instalar el paquete de python docker-compose
  ansible.builtin.pip:
    name: docker-compose
    state: present

- name: Levantar los contenedores de Big Data con Docker Compose
  community.docker.docker_compose:
    project_src: /opt/bigdata
    state: present