    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['192.168.56.10:9100']
        labels: {nodo: master}
      - targets: ['192.168.56.11:9100']
        labels: {nodo: worker1}
      - targets: ['192.168.56.12:9100']
        labels: {nodo: worker2}

  - job_name: cadvisor
