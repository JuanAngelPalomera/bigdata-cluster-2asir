- name: Crear directorio de configuración de systemd-resolved
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Fijar servidores DNS IPv4
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns.conf
    content: |
      [Resolve]
      DNS=8.8.8.8 1.1.1.1
      FallbackDNS=9.9.9.9
    mode: "0644"
  notify: Reiniciar systemd-resolved

- name: Aplicar cambios de DNS ahora
  ansible.builtin.meta: flush_handlers

- name: Instalar paquetes básicos
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Quitar el hostname de las IPs de loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.\d+\.\d+\s+{{ inventory_hostname }}'
    state: absent

- name: Añadir todos los nodos del clúster a /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE CLUSTER"
    block: |
      {% for h in groups['all'] %}
      {{ hostvars[h].ansible_host }} {{ h }}
      {% endfor %}