- name: Instalar dependencias para el repositorio de Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Crear el directorio de claves de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar la clave GPG oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Añadir el repositorio oficial de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Instalar Docker Engine y el plugin de Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true

- name: Arrancar y habilitar el servicio Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Añadir el usuario vagrant al grupo docker
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: true